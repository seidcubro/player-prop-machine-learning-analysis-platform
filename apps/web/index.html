<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Windows and a few crawlers still reach for the .ico before the SVG. -->
    <link rel="alternate icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06080f" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="Compare sportsbook player prop lines against machine-learning projections and find the edge."
    />
    <title>PriorLine | Our prior. Their line.</title>

    <!-- Link previews. Without these a shared link renders as a bare URL, which
         is the difference between looking like a product and looking like a
         localhost demo someone pasted into a chat. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PriorLine" />
    <meta property="og:title" content="PriorLine" />
    <meta
      property="og:description"
      content="NFL player prop projections from a machine-learning model, priced against real sportsbook lines."
    />
    <!-- Absolute, not root-relative.
         Open Graph is fetched by a crawler that has no page context, so a
         relative path is resolved against nothing. Slack, Discord and iMessage
         all drop the image outright; the link renders as a bare URL, which is
         the exact failure these tags exist to prevent. The origin comes from
         VITE_SITE_URL at build time, and the build refuses to run without it. -->
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image-priorline.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PriorLine" />
    <meta
      name="twitter:description"
      content="NFL player prop projections from a machine-learning model, priced against real sportsbook lines."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image-priorline.png" />
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <!-- What the site is, in the form a search engine parses rather than
         guesses at. The search box is the one piece with a visible payoff: it
         is what lets a result carry its own player search underneath it. The
         URL it points at is a real route, so nothing here claims a capability
         the site does not have. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "PriorLine",
        "url": "%VITE_SITE_URL%/",
        "description": "NFL player prop projections from a machine-learning model, priced against real sportsbook lines.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "%VITE_SITE_URL%/players?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
