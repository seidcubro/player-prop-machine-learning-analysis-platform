name: player-prop-platform

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:7
    ports:
      - 6379:6379

  api:
    build:
      context: ./services/api
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/app
      REDIS_URL: redis://redis:6379/0
      ODDS_API_KEY: ${ODDS_API_KEY}
      ODDS_API_BASE_URL: ${ODDS_API_BASE_URL}
      ODDS_API_SPORT: ${ODDS_API_SPORT}
      ODDS_API_REGIONS: ${ODDS_API_REGIONS}
      ODDS_API_ODDS_FORMAT: ${ODDS_API_ODDS_FORMAT}
      ODDS_API_BOOKMAKERS: ${ODDS_API_BOOKMAKERS}
      # Shared secret for the four POST endpoints that rewrite the database or
      # spend Odds API credits. Unset means those endpoints return 503, which is
      # the safe default; reads are unaffected. See services/api/app/admin_auth.py
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # Comma-separated browser origins allowed to call the API. Local Vite is
      # assumed; add the deployed frontend's origin here.
      WEB_ORIGINS: ${WEB_ORIGINS:-}
      WEB_ORIGIN_REGEX: ${WEB_ORIGIN_REGEX:-}
    ports:
      - 8000:8000
    volumes:
      - ./services/training/artifacts:/artifacts:ro
    depends_on:
      - postgres
      - redis

  inference:
    build:
      context: ./services/inference
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/app
      REDIS_URL: redis://redis:6379/0
    ports:
      - 8001:8001
    depends_on:
      - postgres
      - redis

  training:
    build:
      context: ./services/training
    environment:
      ARTIFACT_DIR: /artifacts
      # Needed by backfill_historical_odds.py; unused by the model scripts.
      ODDS_API_KEY: ${ODDS_API_KEY}
      ODDS_API_BASE_URL: ${ODDS_API_BASE_URL}
      ODDS_API_SPORT: ${ODDS_API_SPORT}
      ODDS_API_REGIONS: ${ODDS_API_REGIONS}
      ODDS_API_BOOKMAKERS: ${ODDS_API_BOOKMAKERS}
      LOOKBACK: "5"
      POSTGRES_DB: app
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: app
      POSTGRES_PORT: "5432"
      POSTGRES_USER: app
    volumes:
      - ./services/training/artifacts:/artifacts
      # Read-only so audit_freshness.py can compare the API service's market map
      # against this service's. The two cannot import each other, and when they
      # drifted the sync quietly stopped buying a market nothing noticed was
      # missing.
      - ./services/api/app/odds_market_map.py:/opt/api_odds_market_map.py:ro
    depends_on:
      - postgres

volumes:
  postgres_data:
